<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FRIDAY NIGHT · 解冻倒计时</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100dvh}.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 70% 25%,rgba(190,20,20,.22),transparent 38%),linear-gradient(135deg,#080808 0%,#180607 50%,#030303 100%)}.glow{position:absolute;width:70vw;height:70vw;right:-12vw;top:-10vw;border-radius:50%;background:rgba(220,25,25,.17);filter:blur(90px)}.person{position:absolute;z-index:2;left:6vw;bottom:0;height:92vh;width:min(53vw,760px);display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 0 25px rgba(255,50,40,.42))}.person img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.top{position:absolute;z-index:5;right:5vw;top:34px;width:min(54vw,820px)}.kicker{font-size:13px;letter-spacing:.38em;color:#aaa}.title{font-size:clamp(42px,7vw,86px);line-height:.85;margin:8px 0 14px;font-weight:950;letter-spacing:-.06em}.title span{color:#f03232}.headline{font-size:clamp(16px,2vw,23px);color:#ddd}.countdown{position:absolute;z-index:6;right:5vw;top:190px;width:min(54vw,820px);padding:20px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);border-radius:14px;backdrop-filter:blur(8px)}.timer{display:flex;gap:8px}.unit{flex:1;padding:14px 5px 10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);border-radius:8px;text-align:center}.num{font-size:clamp(32px,5.5vw,60px);line-height:1;font-weight:800;font-variant-numeric:tabular-nums}.label{font-size:9px;color:#999;letter-spacing:.14em;margin-top:7px}.progress-wrap{margin-top:16px}.progress-info{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:6px}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#971313,#ff3b30);box-shadow:0 0 14px rgba(255,50,40,.8)}.clocks{display:flex;justify-content:space-between;gap:20px;margin-top:14px;color:#aaa;font-size:12px}.clocks b{color:#fff;font-size:14px}.quote{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#aaa;text-align:center;letter-spacing:.08em}.footer{position:absolute;z-index:5;right:5vw;bottom:26px;color:#666;font-size:10px;letter-spacing:.18em}@media(max-width:700px){.person{left:50%;width:110vw;height:60vh;bottom:34vh;transform:translateX(-50%);opacity:.95}.top{left:18px;right:18px;top:18px;width:auto;text-align:center}.countdown{left:10px;right:10px;top:auto;bottom:max(14px,env(safe-area-inset-bottom));width:auto;padding:12px}.headline{display:none}.title{font-size:44px}.unit{padding:9px 3px 8px}.num{font-size:30px}.clocks{font-size:10px}.footer{display:none}}
</style></head><body><div class="stage"><div class="glow"></div><div class="person"><img src="person.png" alt="Friday Night 主体人物"></div><header class="top"><div class="kicker">THE FRIDAY NIGHT</div><div class="title">FRIDAY <span>NIGHT</span></div><div class="headline">每周五晚上 20:00 · 解冻时间</div></header><main class="countdown"><div class="timer"><div class="unit"><div class="num" id="days">00</div><div class="label">DAYS</div></div><div class="unit"><div class="num" id="hours">00</div><div class="label">HOURS</div></div><div class="unit"><div class="num" id="minutes">00</div><div class="label">MINUTES</div></div><div class="unit"><div class="num" id="seconds">00</div><div class="label">SECONDS</div></div></div><div class="progress-wrap"><div class="progress-info"><span>本周解冻进度</span><span id="percent">0%</span></div><div class="progress"><div class="bar" id="bar"></div></div></div><div class="clocks"><div>北京时间 <b id="beijing">--:--:--</b></div><div>加州时间 <b id="california">--:--:--</b></div></div><div class="quote">ALL NIGHT · EVERY FRIDAY</div></main><div class="footer">FRIDAY NIGHT · COUNTDOWN</div></div><script>
function nextFriday8pm(){const n=new Date(),t=new Date(n),d=(5-n.getDay()+7)%7;t.setDate(n.getDate()+d);t.setHours(20,0,0,0);if(t<=n)t.setDate(t.getDate()+7);return t}function prevFriday(t){const s=new Date(t);s.setDate(s.getDate()-7);return s}function p(n){return String(n).padStart(2,'0')}let target=nextFriday8pm();function update(){const now=new Date();if(now>=target)target=nextFriday8pm();const start=prevFriday(target),total=target-start,remain=Math.max(0,target-now),elapsed=Math.min(total,Math.max(0,now-start)),pct=elapsed/total*100,s=Math.floor(remain/1000);document.getElementById('days').textContent=p(Math.floor(s/86400));document.getElementById('hours').textContent=p(Math.floor(s%86400/3600));document.getElementById('minutes').textContent=p(Math.floor(s%3600/60));document.getElementById('seconds').textContent=p(s%60);document.getElementById('bar').style.width=pct+'%';document.getElementById('percent').textContent=pct.toFixed(1)+'%';document.getElementById('beijing').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);document.getElementById('california').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'America/Los_Angeles',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now)}update();setInterval(update,250);
</script></body></html>
